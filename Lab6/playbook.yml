- name: Setup Asciinema and Apache Web Server
  hosts: targets
  become: true

  pre_tasks:
    - name: Update apt cache if needed.
      apt: update_cache=yes cache_valid_time=3600

  tasks:
    - name: Install asciinema and apache2 package.
      apt:
        state: present
        name:
          - asciinema
          - apache2

    - name: Start and enable Apache service
      service:
        name: apache2
        state: started
        enabled: yes

    - name: "Complete Task 3"
      debug:
        msg: "Task 3 completed"
